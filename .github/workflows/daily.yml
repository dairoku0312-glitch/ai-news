name: daily-news

on:
  schedule:
    # 22:25 UTC = 翌朝 07:25 JST（GitHubの0分混雑を避け、8時までに更新が間に合うよう早めに起動）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同時実行を防ぐ（実行中に手動実行が重なると push が競合するため）
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and summarize news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit updated news data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "data/news.json に変更はありません"
          else
            git add data/news.json
            git commit -m "news: $(TZ=Asia/Tokyo date +%F)"
            # 実行中にリモートが進んでいても push できるよう、取り込んでから push（最大3回）
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push リトライ $i 回目"
              sleep 5
            done
          fi
